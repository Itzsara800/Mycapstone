<!DOCTYPE html>
<html>
<head>
<title>My Game</title>
<style>
  body { background: white; font-family: Arial; text-align: center; }
  #name { position: absolute; top: 10px; left: 10px; }
  #language { position: absolute; top: 10px; right: 10px; }
  #buttons button { display: block; margin: 5px auto; width: 120px; }
  #buttons { position: absolute; right: 10px; top: 80px; }
  h1 { margin-top: 150px; }
</style>
</head>
<body>

<input id="name" placeholder="Type your name">

<div id="language">
  <p>Language?</p>
  <button>English</button>
  <button>Spanish</button>
</div>

<h1>Title</h1>

<div id="buttons">
  <button>Start</button>
  <button onclick="document.getElementById('song').play()">Music</button>
  <button onclick="document.getElementById('song').pause()">Mute</button>
  <button onclick="alert('Instructions here')">How to play</button>
</div>

<audio id="song" src="music.mp3" loop></audio>

</body>
</html>
